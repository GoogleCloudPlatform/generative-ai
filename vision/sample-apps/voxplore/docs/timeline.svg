<line x1="825.1" y1="340" x2="825.1" y2="510" stroke="#57606a" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="190.0" y="346" width="72.3" height="22" rx="5" fill="#ffffff" stroke="#57606a"/>
<text x="198.0" y="361" font-size="10.5" fill="#1f2328">asks</text>

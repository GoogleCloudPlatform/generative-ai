<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">VoxPlore: one request over time</title>
<desc id="d">A timeline with five lanes. The user asks. The avatar says it is building the scene and keeps explaining for about thirty seconds while a background model writes the scene. When the scene is on the stage the avatar invites the user to try it, and it comments when the user moves a slider.</desc>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
<marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a73e8"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e37400"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="289" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<g transform="translate(0 -296)">
<rect x="24" y="314" width="12" height="12" rx="3" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.3"/>

<line x1="190" y1="391" x2="956.5" y2="391" stroke="#eaeef2" stroke-width="22" stroke-linecap="butt"/>
<text x="24" y="429" font-size="11.5" fill="#1f2328" font-weight="600">Messages</text>
<line x1="190" y1="425" x2="956.5" y2="425" stroke="#eaeef2" stroke-width="22" stroke-linecap="butt"/>
<text x="24" y="463" font-size="11.5" fill="#1f2328" font-weight="600">Background model</text>
<line x1="190" y1="459" x2="956.5" y2="459" stroke="#eaeef2" stroke-width="22" stroke-linecap="butt"/>
<text x="24" y="497" font-size="11.5" fill="#1f2328" font-weight="600">Stage</text>
<line x1="190" y1="493" x2="956.5" y2="493" stroke="#eaeef2" stroke-width="22" stroke-linecap="butt"/>
<line x1="266.6" y1="340" x2="266.6" y2="510" stroke="#57606a" stroke-width="1" stroke-dasharray="3 3"/>

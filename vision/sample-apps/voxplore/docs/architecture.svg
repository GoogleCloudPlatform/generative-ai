<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 302" width="1000" height="302" role="img" aria-labelledby="t d" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">VoxPlore: system overview</title>
<desc id="d">The user and the live model talk in real time. The live model sends a function call to a tool runner, which answers at once and hands the work to one of four background models. The result appears on a stage, and what is displayed and what the user does with it are reported back to the live model.</desc>

[project]
name = "agent-quality-flywheel"
version = "0.1.0"
description = "Run the agent quality flywheel with agents-cli: a hands-on eval sample."
authors = [{ name = "Lavi Nigam" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[eval]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

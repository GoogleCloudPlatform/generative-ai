name: "Gate 4: Production Release to Cloud Run & Gemini Agent Platform (main branch)"

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "model_serving/**"
      - "environments/prod.env"
      - "pyproject.toml"
      - ".github/workflows/agent-cd-prod.yml"
  workflow_dispatch:

jobs:
  deploy-production-cloud-run:
    runs-on: ubuntu-latest
    # Protected by GitHub Branch Protection + Required Reviewers.
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository (main branch)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve Production Configuration
        env:
          CFG_PROJECT: ${{ vars.GCP_PROD_PROJECT_ID }}
          CFG_REGION: ${{ vars.GCP_REGION }}
          CFG_MAAS_MODEL: ${{ vars.GEMMA_MAAS_MODEL_ID }}
        run: |
          ENV_FILE="environments/prod.env"
          [ -f "$ENV_FILE" ] || ENV_FILE="environments/prod.env.example"
          while IFS='=' read -r key val || [ -n "$key" ]; do
            [[ "$key" =~ ^[[:space:]]*# || -z "$key" ]] && continue
            key=$(echo "$key" | tr -d '[:space:]')
            val=$(echo "$val" | tr -d '\r')
            export "${key}=${val}"
            echo "${key}=${val}" >> "$GITHUB_ENV"
          done < "$ENV_FILE"

          {
            echo "DEPLOY_TAG=prod-${GITHUB_SHA::7}"
            echo "SERVICE_NAME=${CLOUD_RUN_SERVICE:-gemma-agent-prod}"
            echo "TARGET_REGION=${CFG_REGION:-${GCP_REGION:-us-west1}}"
            echo "TARGET_PROJECT=${CFG_PROJECT:-${GOOGLE_CLOUD_PROJECT:-prod-project}}"
            echo "MAAS_MODEL=${CFG_MAAS_MODEL:-${GEMMA_MAAS_MODEL_ID:-google/gemma-4-26b-a4b-it-maas}}"
          } >> "$GITHUB_ENV"

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Authenticate to Google Cloud Production via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PROD }}
          service_account: ${{ vars.WIF_SA_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install dependencies
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install httpx

      - name: Deploy Candidate Revision to Cloud Run Production
        run: |
          ENV_VARS="AGENT_ENV=prod,USE_MAAS=1,GEMMA_MAAS_MODEL_ID=${MAAS_MODEL},GOOGLE_CLOUD_PROJECT=${TARGET_PROJECT},GOOGLE_CLOUD_LOCATION=global,GCP_REGION=${TARGET_REGION}"
          EXTRA_ARGS=()
          if gcloud run services describe "${SERVICE_NAME}" --region="${TARGET_REGION}" --project="${TARGET_PROJECT}" >/dev/null 2>&1; then
            echo "Existing production service detected: deploying dark candidate for 10% Canary..."
            echo "HAS_PRIOR_REVISION=1" >> "$GITHUB_ENV"
            EXTRA_ARGS+=(--no-traffic)
          else
            echo "Initial bootstrap deployment for ${SERVICE_NAME} in ${TARGET_PROJECT}..."
            echo "HAS_PRIOR_REVISION=0" >> "$GITHUB_ENV"
          fi
          gcloud run deploy "${SERVICE_NAME}" \
            --source . \
            --clear-base-image \
            --region="${TARGET_REGION}" \
            --project="${TARGET_PROJECT}" \
            --tag="${DEPLOY_TAG}" \
            --no-allow-unauthenticated \
            --session-affinity \
            --timeout=300s \
            --min-instances="${MIN_INSTANCES:-1}" \
            --max-instances="${MAX_INSTANCES:-20}" \
            --set-env-vars="${ENV_VARS}" \
            ${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"}

      - name: Shift 10% Canary Traffic to New Production Revision
        if: env.HAS_PRIOR_REVISION == '1'
        run: |
          gcloud run services update-traffic "${SERVICE_NAME}" \
            --region="${TARGET_REGION}" \
            --project="${TARGET_PROJECT}" \
            --to-tags="${DEPLOY_TAG}=10"

      - name: Gate 4 - Production Canary Health & Latency Validation
        env:
          OVERRIDE_PEAK_USERS: ${{ vars.TARGET_PEAK_USERS }}
        run: |
          PEAK_USERS="${OVERRIDE_PEAK_USERS:-${TARGET_PEAK_USERS:-5}}"
          RAMP_SECS="2"
          if [ -n "$OVERRIDE_PEAK_USERS" ]; then
            RAMP_SECS="10"
          fi

          # Mint the OIDC token for the canonical service URL, then probe the
          # tagged Canary revision URL so 100% of checks hit the new revision.
          PROD_URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --region="${TARGET_REGION}" --project="${TARGET_PROJECT}" \
            --format="value(status.url)")
          CANARY_URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --region="${TARGET_REGION}" --project="${TARGET_PROJECT}" \
            --format="value(status.traffic.filter(tag=${DEPLOY_TAG}).extract(url).flatten())")
          TARGET_URL="${CANARY_URL:-$PROD_URL}"
          echo "Validating Canary revision (${DEPLOY_TAG}) at ${TARGET_URL} with ${PEAK_USERS} concurrent users..."

          ID_TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="${{ vars.WIF_SA_PROD }}" \
            --audiences="$PROD_URL" --include-email 2>/dev/null \
            || gcloud auth print-identity-token --audiences="$PROD_URL" 2>/dev/null \
            || gcloud auth print-identity-token)
          python tests/load/load_test_cloud_run.py \
            --url "$TARGET_URL" \
            --bearer-token "$ID_TOKEN" \
            --users "$PEAK_USERS" \
            --concurrency "$PEAK_USERS" \
            --ramp-seconds "$RAMP_SECS" \
            --slo-p95 "${SLO_P95_SECONDS:-35.0}"

      - name: Promote Validated Canary Revision to 100% Production Traffic
        run: |
          gcloud run services update-traffic "${SERVICE_NAME}" \
            --region="${TARGET_REGION}" \
            --project="${TARGET_PROJECT}" \
            --to-tags="${DEPLOY_TAG}=100"

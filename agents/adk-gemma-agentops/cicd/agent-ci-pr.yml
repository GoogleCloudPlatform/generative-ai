name: "Gate 2: Agent PR CI (dev -> staging & staging -> main)"

on:
  pull_request:
    branches: [staging, main]
    paths:
      - "app/**"
      - "model_serving/**"
      - "tests/**"
      - "environments/**"
      - "cicd/**"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  unit-and-contract-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install dependencies, ruff & pip-audit
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install pytest pytest-asyncio ruff pip-audit "google-adk[eval]" google-auth httpx python-dotenv

      - name: Supply-Chain Vulnerability Audit (OSV / PyPI Advisory Check)
        run: pip-audit --strict --desc

      - name: Run Gate 2 Linting, Formatting & Deterministic Unit Tests
        run: |
          ruff format --check app/ cicd/ model_serving/ tests/
          ruff check app/ cicd/ model_serving/ tests/
          PYTHONPATH=. pytest tests/unit/test_agent_unit.py -k "not integration" -v

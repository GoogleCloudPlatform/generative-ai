[project]
name = "pooled-multi-tenant-agents"
version = "0.3.0"
description = "Reference architecture for pooled multi-tenant AI agents on Google Cloud with Gemini Enterprise Agent Platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "google-genai>=1.10.0",
    "pydantic>=2.10.0",
    "pyjwt>=2.10.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

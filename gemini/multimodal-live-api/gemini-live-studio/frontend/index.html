<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Live Studio</title>
    <script>
      // Apply the saved theme before first paint (avoids a light flash for
      // dark users). Mirrors Store.getSettings().theme; defaults to light.
      try {
        var t = JSON.parse(localStorage.getItem('gemini_avatar_settings') || '{}').theme;
        document.documentElement.dataset.theme = t === 'dark' || t === 'system' ? t : 'light';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
    />
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="/src/my-element.ts"></script>
  </head>
  <body>
    <my-element> </my-element>
  </body>
</html>
